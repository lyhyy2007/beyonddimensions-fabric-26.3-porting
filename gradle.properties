# Gradle 运行配置
# configuration-cache=false 是 fabric-loom 已知 issue #1349 的官方建议做法。
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---- 目标环境（Fabric 26.3 线）----
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.161.0+26.3

# ---- 上游模组元数据（与上游 gradle.properties 保持一致）----
mod_id=beyonddimensions
mod_name=Beyond Dimensions
mod_license=MIT
mod_authors=Frostbite
mod_description=A mod provided some utilities.
mod_group_id=com.wintercogs.beyonddimensions

# 实际产物版本在 build.gradle 中显式声明（形如 0.7.13+26.3），此处不再重复。
